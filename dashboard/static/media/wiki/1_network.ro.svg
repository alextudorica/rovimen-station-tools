<?xml version="1.0" encoding="UTF-8"?>
<!--
  Romanian translation of 1_network.svg. Geometry is identical; only the text
  differs, so a fix to the layout must be applied to both files. Romanian runs
  longer than English, so lines were shortened rather than boxes widened: the
  two files stay diffable line for line.

  Only numeric character references. Named HTML entities are undefined in
  standalone SVG, which is how <img src> parses this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 880" width="1440" height="880"
     font-family="Helvetica, Arial, sans-serif">

  <style>
    .ttl    { font-size: 22px; font-weight: bold; fill: #1a1a1a; }
    .sub    { font-size: 14px; fill: #5a6672; }
    .lbl    { font-size: 15px; font-weight: bold; fill: #1a1a1a; }
    .note   { font-size: 12.5px; fill: #55606b; }
    .tiny   { font-size: 11.5px; fill: #6b7681; }
    .part   { fill: #f5f7f8; stroke: #5b6b7c; stroke-width: 1.6; }
    .cloud  { fill: #eef2f6; stroke: #9aa5b1; stroke-width: 1.5; }
    .cam    { fill: #eaf4ec; stroke: #3f9c56; stroke-width: 1.6; }
    .remote { fill: #fdf6e3; stroke: #c9a227; stroke-width: 1.5; }
    .outp   { fill: #fbfdfb; stroke: #c3d4c7; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .link   { stroke: #7c8794; stroke-width: 1.8; fill: none; }
    .poe    { stroke: #5b6b7c; stroke-width: 2.6; fill: none; }
    .vid    { stroke: #8a94a0; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8794"/>
    </marker>
  </defs>

  <rect width="1440" height="880" fill="#ffffff"/>

  <text class="ttl" x="52" y="50">Cea mai simpl&#259; re&#539;ea de sta&#539;ie</text>
  <text class="sub" x="52" y="74">Un switch PoE, un cablu pentru fiecare camer&#259;, un calculator. Totul st&#259; pe 192.168.1.x, &#238;n spatele routerului pe care &#238;l ai deja.</text>

  <!-- internet -->
  <rect class="cloud" x="130" y="110" width="180" height="54" rx="27"/>
  <text class="lbl" x="220" y="143" text-anchor="middle">Internet</text>
  <path class="link" d="M 220 164 V 202" marker-end="url(#arw)"/>

  <!-- router -->
  <rect class="part" x="60" y="208" width="320" height="96" rx="7"/>
  <text class="lbl" x="220" y="240" text-anchor="middle">Router de acas&#259;</text>
  <text class="note" x="220" y="264" text-anchor="middle">192.168.1.1 &#183; distribuie DHCP</text>
  <text class="note" x="220" y="284" text-anchor="middle">cel pe care &#238;l ai deja</text>

  <!-- router to switch -->
  <path class="link" d="M 380 256 H 450 V 344 H 506" marker-end="url(#arw)"/>
  <text class="tiny" x="458" y="248">orice port LAN, &#238;n portul Gigabit de uplink</text>

  <!-- switch -->
  <rect class="part" x="512" y="300" width="392" height="140" rx="7"/>
  <text class="lbl" x="708" y="336" text-anchor="middle">Switch PoE</text>
  <text class="note" x="708" y="360" text-anchor="middle">TP-Link LS1210P &#183; 8 x PoE+ &#183; 96 W total</text>
  <text class="note" x="708" y="382" text-anchor="middle">camerele pe porturile PoE 10/100 (destul)</text>
  <text class="note" x="708" y="404" text-anchor="middle">routerul &#537;i PC-ul pe cele 2 porturi Gigabit</text>
  <text class="note" x="708" y="426" text-anchor="middle">un cablu pe camer&#259;, f&#259;r&#259; alimentare afar&#259;</text>

  <!-- PoE runs -->
  <path class="poe" d="M 904 330 L 1022 216" marker-end="url(#arw)"/>
  <path class="poe" d="M 904 370 L 1022 322" marker-end="url(#arw)"/>
  <path class="poe" d="M 904 410 L 1022 432" marker-end="url(#arw)"/>
  <text class="tiny" x="958" y="302" text-anchor="middle">PoE+</text>

  <!-- outdoors -->
  <rect class="outp" x="1000" y="110" width="400" height="430" rx="10"/>
  <text class="tiny" x="1020" y="138">Exterior &#183; un cablu Cat6 pentru fiecare</text>
  <text class="tiny" x="1020" y="156">camer&#259;, f&#259;r&#259; alimentare separat&#259; acolo</text>

  <rect class="cam" x="1024" y="176" width="352" height="78" rx="6"/>
  <text class="lbl" x="1200" y="206" text-anchor="middle">Camera 1</text>
  <text class="note" x="1200" y="228" text-anchor="middle">192.168.1.201 &#183; setat de noi</text>

  <rect class="cam" x="1024" y="286" width="352" height="78" rx="6"/>
  <text class="lbl" x="1200" y="316" text-anchor="middle">Camera 2</text>
  <text class="note" x="1200" y="338" text-anchor="middle">192.168.1.202 &#183; setat de noi</text>

  <rect class="cam" x="1024" y="396" width="352" height="78" rx="6"/>
  <text class="lbl" x="1200" y="426" text-anchor="middle">Camera 3</text>
  <text class="note" x="1200" y="448" text-anchor="middle">192.168.1.203 &#183; setat de noi</text>

  <text class="note" x="1200" y="506" text-anchor="middle">&#206;ncepe cu una. Switch-ul duce 8; limita e PC-ul.</text>

  <!-- switch to PC -->
  <path class="link" d="M 708 440 V 550" marker-end="url(#arw)"/>
  <text class="tiny" x="718" y="500">LAN</text>

  <!-- station PC -->
  <rect class="part" x="400" y="556" width="360" height="140" rx="7"/>
  <text class="lbl" x="580" y="590" text-anchor="middle">Calculatorul sta&#539;iei</text>
  <text class="note" x="580" y="614" text-anchor="middle">adres&#259; de la router</text>
  <text class="note" x="580" y="636" text-anchor="middle">Ubuntu 24.04 + RMS</text>
  <text class="note" x="580" y="658" text-anchor="middle">&#238;nregistreaz&#259; noaptea, proceseaz&#259; &#238;n zori,</text>
  <text class="note" x="580" y="680" text-anchor="middle">&#238;ncarc&#259;, apoi o ia de la cap&#259;t</text>

  <!-- video streams back to the PC -->
  <path class="vid" d="M 1000 520 C 920 560, 850 586, 768 598" marker-end="url(#arw)"/>
  <text class="note" x="930" y="530" text-anchor="end">video RTSP, ~8 Mbit/s pe camer&#259;</text>

  <!-- uploads -->
  <path class="link" d="M 760 640 H 1074" marker-end="url(#arw)"/>
  <text class="tiny" x="900" y="630" text-anchor="middle">detec&#539;iile, o dat&#259; pe zi, &#238;n zori</text>

  <rect class="remote" x="1080" y="600" width="320" height="110" rx="7"/>
  <text class="lbl" x="1240" y="634" text-anchor="middle">Serverul GMN</text>
  <text class="note" x="1240" y="658" text-anchor="middle">datele tale intr&#259; &#238;n re&#539;ea</text>
  <text class="note" x="1240" y="680" text-anchor="middle">&#537;i se calculeaz&#259; traiectorii</text>

  <path class="link" d="M 760 672 H 900 V 795 H 1074" marker-end="url(#arw)"/>
  <text class="tiny" x="910" y="790">prin Tailscale</text>

  <rect class="remote" x="1080" y="740" width="320" height="110" rx="7"/>
  <text class="lbl" x="1240" y="774" text-anchor="middle">Dashboard ROVIMEN</text>
  <text class="note" x="1240" y="798" text-anchor="middle">clipuri, imagini de noapte, starea ei,</text>
  <text class="note" x="1240" y="820" text-anchor="middle">suport la distan&#539;&#259;, f&#259;r&#259; deplasare</text>

  <text class="tiny" x="60" y="866">Linie continu&#259; = cablu Ethernet (duce &#537;i alimentarea) &#183; linie &#238;ntrerupt&#259; = fluxul video care se &#238;ntoarce pe acela&#537;i cablu.</text>

</svg>
