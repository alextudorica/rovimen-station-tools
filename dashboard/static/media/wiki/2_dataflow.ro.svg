<?xml version="1.0" encoding="UTF-8"?>
<!--
  Romanian translation of 2_dataflow.svg. Geometry is identical; only the text
  differs, so a layout fix must be applied to both files.

  Only numeric character references.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 740" width="1440" height="740"
     font-family="Helvetica, Arial, sans-serif">

  <style>
    .ttl    { font-size: 22px; font-weight: bold; fill: #1a1a1a; }
    .sub    { font-size: 14px; fill: #5a6672; }
    .lbl    { font-size: 15px; font-weight: bold; fill: #1a1a1a; }
    .note   { font-size: 12.5px; fill: #55606b; }
    .tiny   { font-size: 11.5px; fill: #6b7681; }
    .phase  { font-size: 13px; font-weight: bold; fill: #4a5560; }
    .cam    { fill: #eaf4ec; stroke: #3f9c56; stroke-width: 1.6; }
    .proc   { fill: #f5f7f8; stroke: #5b6b7c; stroke-width: 1.6; }
    .rov    { fill: #eef4fb; stroke: #3d7ab8; stroke-width: 1.6; }
    .remote { fill: #fdf6e3; stroke: #c9a227; stroke-width: 1.5; }
    .result { fill: #f3ecfa; stroke: #8e6bc0; stroke-width: 1.6; }
    .local  { fill: #f7f8f9; stroke: #b9c0c7; stroke-width: 1.4; }
    .panN   { fill: #fbfdfb; stroke: #c3d4c7; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .panD   { fill: #fafbfc; stroke: #c8d0d8; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .link   { stroke: #7c8794; stroke-width: 1.8; fill: none; }
    .fat    { stroke: #5b6b7c; stroke-width: 3; fill: none; }
    .soft   { stroke: #8a94a0; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8794"/>
    </marker>
  </defs>

  <rect width="1440" height="740" fill="#ffffff"/>

  <text class="ttl" x="52" y="50">Ce se &#238;nt&#226;mpl&#259; cu o noapte de video</text>
  <text class="sub" x="52" y="74">Nimeni nu atinge nimic din asta. Sta&#539;ia porne&#537;te la apus, proceseaz&#259; &#238;n zori, &#238;ncarc&#259; &#537;i a&#537;teapt&#259; noaptea urm&#259;toare.</text>

  <!-- ============ NOAPTE ============ -->
  <rect class="panN" x="40" y="100" width="620" height="330" rx="10"/>
  <text class="phase" x="64" y="128">La apus, apoi toat&#259; noaptea</text>

  <rect class="cam" x="70" y="188" width="182" height="112" rx="6"/>
  <text class="lbl" x="161" y="220" text-anchor="middle">Camera</text>
  <text class="note" x="161" y="244" text-anchor="middle">25 fps, 1280x720</text>
  <text class="note" x="161" y="264" text-anchor="middle">transmite pe cablul</text>
  <text class="note" x="161" y="284" text-anchor="middle">Ethernet</text>

  <path class="link" d="M 252 224 L 394 206" marker-end="url(#arw)"/>
  <text class="tiny" x="322" y="200" text-anchor="middle">RTSP</text>
  <path class="link" d="M 252 266 L 394 328" marker-end="url(#arw)"/>
  <text class="tiny" x="322" y="316" text-anchor="middle">RTSP</text>

  <rect class="proc" x="400" y="160" width="230" height="106" rx="6"/>
  <text class="lbl" x="515" y="190" text-anchor="middle">Captur&#259; RMS</text>
  <text class="note" x="515" y="212" text-anchor="middle">scrie noaptea pe disc</text>
  <text class="note" x="515" y="232" text-anchor="middle">&#238;n blocuri de 256 cadre</text>
  <text class="note" x="515" y="250" text-anchor="middle">(asta se analizeaz&#259;)</text>

  <rect class="rov" x="400" y="286" width="230" height="106" rx="6"/>
  <text class="lbl" x="515" y="316" text-anchor="middle">Captur&#259; color</text>
  <text class="note" x="515" y="338" text-anchor="middle">ROVIMEN, &#238;n paralel</text>
  <text class="note" x="515" y="358" text-anchor="middle">buc&#259;&#539;i de video color</text>
  <text class="note" x="515" y="376" text-anchor="middle">(asta arat&#259; frumos)</text>

  <!-- predare -->
  <path class="fat" d="M 636 272 H 774" marker-end="url(#arw)"/>
  <text class="tiny" x="705" y="262" text-anchor="middle">fi&#537;ierele nop&#539;ii</text>

  <!-- ============ ZORI ============ -->
  <rect class="panD" x="780" y="100" width="620" height="330" rx="10"/>
  <text class="phase" x="804" y="128">&#206;n zori: rafala de procesare. Asta dimensioneaz&#259; procesorul.</text>

  <rect class="proc" x="812" y="150" width="556" height="76" rx="6"/>
  <text class="lbl" x="1090" y="180" text-anchor="middle">Detec&#539;ie</text>
  <text class="note" x="1090" y="202" text-anchor="middle">parcurge fiecare bloc c&#259;ut&#226;nd dungi de lumin&#259;</text>

  <path class="link" d="M 1090 226 V 246" marker-end="url(#arw)"/>

  <rect class="proc" x="812" y="252" width="556" height="76" rx="6"/>
  <text class="lbl" x="1090" y="282" text-anchor="middle">Calibrare</text>
  <text class="note" x="1090" y="304" text-anchor="middle">potrive&#537;te stelele vizibile cu un catalog de stele</text>

  <path class="link" d="M 1090 328 V 348" marker-end="url(#arw)"/>

  <rect class="proc" x="812" y="354" width="556" height="76" rx="6"/>
  <text class="lbl" x="1090" y="384" text-anchor="middle">Compunere &#537;i encodare</text>
  <text class="note" x="1090" y="406" text-anchor="middle">imaginea nop&#539;ii, timelapse &#537;i un clip scurt pentru fiecare meteor</text>

  <!-- ============ REZULTATE ============ -->
  <path class="link" d="M 1000 430 V 476 H 480 V 512" marker-end="url(#arw)"/>
  <text class="tiny" x="740" y="468" text-anchor="middle">detec&#539;ii &#537;i calibrare, o dat&#259; pe zi</text>

  <path class="link" d="M 1270 430 V 512" marker-end="url(#arw)"/>
  <text class="tiny" x="1280" y="478">trimise prin HTTPS</text>

  <path class="soft" d="M 410 384 C 340 440, 250 470, 172 506" marker-end="url(#arw)"/>

  <rect class="local" x="40" y="512" width="228" height="126" rx="7"/>
  <text class="lbl" x="154" y="544" text-anchor="middle">R&#259;m&#226;ne local</text>
  <text class="note" x="154" y="568" text-anchor="middle">materialul brut nu</text>
  <text class="note" x="154" y="588" text-anchor="middle">pleac&#259; de la sta&#539;ie</text>
  <text class="note" x="154" y="612" text-anchor="middle">nop&#539;ile cele mai vechi</text>
  <text class="note" x="154" y="632" text-anchor="middle">sunt reciclate automat</text>

  <rect class="remote" x="300" y="512" width="360" height="126" rx="7"/>
  <text class="lbl" x="480" y="544" text-anchor="middle">Serverul GMN</text>
  <text class="note" x="480" y="568" text-anchor="middle">c&#226;teva sute de MB pe noapte, nu videoul:</text>
  <text class="note" x="480" y="588" text-anchor="middle">tabele de detec&#539;ii, calibrare, imagini</text>
  <text class="note" x="480" y="612" text-anchor="middle">asta e partea care face camera ta</text>
  <text class="note" x="480" y="632" text-anchor="middle">parte din re&#539;ea</text>

  <path class="link" d="M 660 575 H 712" marker-end="url(#arw)"/>

  <rect class="result" x="718" y="512" width="360" height="126" rx="7"/>
  <text class="lbl" x="898" y="544" text-anchor="middle">Calculul traiectoriei</text>
  <text class="note" x="898" y="568" text-anchor="middle">c&#226;nd dou&#259; sau mai multe sta&#539;ii au prins</text>
  <text class="note" x="898" y="588" text-anchor="middle">acela&#537;i meteor, traseul 3D real, viteza</text>
  <text class="note" x="898" y="612" text-anchor="middle">&#537;i orbita rezult&#259; din geometrie</text>
  <text class="note" x="898" y="632" text-anchor="middle">o singur&#259; camer&#259; nu poate face asta</text>

  <rect class="rov" x="1136" y="512" width="264" height="126" rx="7"/>
  <text class="lbl" x="1268" y="544" text-anchor="middle">Dashboard ROVIMEN</text>
  <text class="note" x="1268" y="568" text-anchor="middle">clipurile &#537;i imaginile tale,</text>
  <text class="note" x="1268" y="588" text-anchor="middle">&#238;n c&#226;teva minute</text>
  <text class="note" x="1268" y="612" text-anchor="middle">starea sta&#539;iei, pe care</text>
  <text class="note" x="1268" y="632" text-anchor="middle">o po&#539;i verifica oric&#226;nd</text>

  <text class="tiny" x="52" y="686">Rafala de detec&#539;ie &#537;i compunere este singura sarcin&#259; grea: &#238;nregistrarea de toat&#259; noaptea aproape nu folose&#537;te ma&#537;ina, deci cump&#259;r&#259; procesorul pentru zori, nu pentru sear&#259;.</text>
  <text class="tiny" x="52" y="708">Nimic din asta nu are nevoie de om. Singurul motiv s&#259; te conectezi este s&#259; verifici c&#259; merge, iar dashboardul &#238;&#539;i arat&#259; asta dintr-o privire.</text>

</svg>
