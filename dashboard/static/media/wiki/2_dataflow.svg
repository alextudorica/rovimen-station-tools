<?xml version="1.0" encoding="UTF-8"?>
<!--
  Build-guide data flow: what happens to a night of video.

  Hand-written for the same reason as 1_network.svg: Mermaid node labels live in
  <foreignObject>, which is not rendered when the SVG is loaded via <img src>.

  The split into a NIGHT panel and a DAWN panel is the point of the diagram.
  Operators size their PC for the recording load, which is trivial; the burst
  that actually needs cores happens after sunrise.

  Only numeric character references.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 740" width="1440" height="740"
     font-family="Helvetica, Arial, sans-serif">

  <style>
    .ttl    { font-size: 22px; font-weight: bold; fill: #1a1a1a; }
    .sub    { font-size: 14px; fill: #5a6672; }
    .lbl    { font-size: 15px; font-weight: bold; fill: #1a1a1a; }
    .note   { font-size: 12.5px; fill: #55606b; }
    .tiny   { font-size: 11.5px; fill: #6b7681; }
    .phase  { font-size: 13px; font-weight: bold; fill: #4a5560; }
    .cam    { fill: #eaf4ec; stroke: #3f9c56; stroke-width: 1.6; }
    .proc   { fill: #f5f7f8; stroke: #5b6b7c; stroke-width: 1.6; }
    .rov    { fill: #eef4fb; stroke: #3d7ab8; stroke-width: 1.6; }
    .remote { fill: #fdf6e3; stroke: #c9a227; stroke-width: 1.5; }
    .result { fill: #f3ecfa; stroke: #8e6bc0; stroke-width: 1.6; }
    .local  { fill: #f7f8f9; stroke: #b9c0c7; stroke-width: 1.4; }
    .panN   { fill: #fbfdfb; stroke: #c3d4c7; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .panD   { fill: #fafbfc; stroke: #c8d0d8; stroke-width: 1.3; stroke-dasharray: 5 4; }
    .link   { stroke: #7c8794; stroke-width: 1.8; fill: none; }
    .fat    { stroke: #5b6b7c; stroke-width: 3; fill: none; }
    .soft   { stroke: #8a94a0; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
  </style>

  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c8794"/>
    </marker>
  </defs>

  <rect width="1440" height="740" fill="#ffffff"/>

  <text class="ttl" x="52" y="50">What happens to a night of video</text>
  <text class="sub" x="52" y="74">Nobody touches any of this. The station starts at dusk, processes at dawn, uploads, and waits for the next night.</text>

  <!-- ============ NIGHT ============ -->
  <rect class="panN" x="40" y="100" width="620" height="330" rx="10"/>
  <text class="phase" x="64" y="128">At dusk, then all night long</text>

  <rect class="cam" x="70" y="188" width="182" height="112" rx="6"/>
  <text class="lbl" x="161" y="220" text-anchor="middle">Camera</text>
  <text class="note" x="161" y="244" text-anchor="middle">25 fps, 1280x720</text>
  <text class="note" x="161" y="264" text-anchor="middle">streams over the</text>
  <text class="note" x="161" y="284" text-anchor="middle">Ethernet cable</text>

  <path class="link" d="M 252 224 L 394 206" marker-end="url(#arw)"/>
  <text class="tiny" x="322" y="200" text-anchor="middle">RTSP</text>
  <path class="link" d="M 252 266 L 394 328" marker-end="url(#arw)"/>
  <text class="tiny" x="322" y="316" text-anchor="middle">RTSP</text>

  <rect class="proc" x="400" y="160" width="230" height="106" rx="6"/>
  <text class="lbl" x="515" y="190" text-anchor="middle">RMS capture</text>
  <text class="note" x="515" y="212" text-anchor="middle">writes the night to disk</text>
  <text class="note" x="515" y="232" text-anchor="middle">in 256-frame blocks</text>
  <text class="note" x="515" y="250" text-anchor="middle">(this is what gets detected)</text>

  <rect class="rov" x="400" y="286" width="230" height="106" rx="6"/>
  <text class="lbl" x="515" y="316" text-anchor="middle">Colour capture</text>
  <text class="note" x="515" y="338" text-anchor="middle">ROVIMEN, in parallel</text>
  <text class="note" x="515" y="358" text-anchor="middle">colour video chunks</text>
  <text class="note" x="515" y="376" text-anchor="middle">(this is what looks good)</text>

  <!-- handover -->
  <path class="fat" d="M 636 272 H 774" marker-end="url(#arw)"/>
  <text class="tiny" x="705" y="262" text-anchor="middle">the night&#8217;s files</text>

  <!-- ============ DAWN ============ -->
  <rect class="panD" x="780" y="100" width="620" height="330" rx="10"/>
  <text class="phase" x="804" y="128">At dawn: the processing burst. This is what sizes your CPU.</text>

  <rect class="proc" x="812" y="150" width="556" height="76" rx="6"/>
  <text class="lbl" x="1090" y="180" text-anchor="middle">Detect</text>
  <text class="note" x="1090" y="202" text-anchor="middle">walks every block looking for streaks of light</text>

  <path class="link" d="M 1090 226 V 246" marker-end="url(#arw)"/>

  <rect class="proc" x="812" y="252" width="556" height="76" rx="6"/>
  <text class="lbl" x="1090" y="282" text-anchor="middle">Calibrate</text>
  <text class="note" x="1090" y="304" text-anchor="middle">matches the stars it can see to a star catalogue</text>

  <path class="link" d="M 1090 328 V 348" marker-end="url(#arw)"/>

  <rect class="proc" x="812" y="354" width="556" height="76" rx="6"/>
  <text class="lbl" x="1090" y="384" text-anchor="middle">Stack and encode</text>
  <text class="note" x="1090" y="406" text-anchor="middle">night stack, timelapse, and one short clip per meteor</text>

  <!-- ============ OUTPUTS ============ -->
  <path class="link" d="M 1000 430 V 476 H 480 V 512" marker-end="url(#arw)"/>
  <text class="tiny" x="740" y="468" text-anchor="middle">detections and calibration, once a day</text>

  <path class="link" d="M 1270 430 V 512" marker-end="url(#arw)"/>
  <text class="tiny" x="1280" y="478">pushed over HTTPS</text>

  <path class="soft" d="M 410 384 C 340 440, 250 470, 172 506" marker-end="url(#arw)"/>

  <rect class="local" x="40" y="512" width="228" height="126" rx="7"/>
  <text class="lbl" x="154" y="544" text-anchor="middle">Stays local</text>
  <text class="note" x="154" y="568" text-anchor="middle">the raw video never</text>
  <text class="note" x="154" y="588" text-anchor="middle">leaves the station</text>
  <text class="note" x="154" y="612" text-anchor="middle">oldest nights are</text>
  <text class="note" x="154" y="632" text-anchor="middle">recycled automatically</text>

  <rect class="remote" x="300" y="512" width="360" height="126" rx="7"/>
  <text class="lbl" x="480" y="544" text-anchor="middle">GMN server</text>
  <text class="note" x="480" y="568" text-anchor="middle">a few hundred MB a night, not the video:</text>
  <text class="note" x="480" y="588" text-anchor="middle">detection tables, calibration, stacks</text>
  <text class="note" x="480" y="612" text-anchor="middle">this is the part that makes your camera</text>
  <text class="note" x="480" y="632" text-anchor="middle">part of the network</text>

  <path class="link" d="M 660 575 H 712" marker-end="url(#arw)"/>

  <rect class="result" x="718" y="512" width="360" height="126" rx="7"/>
  <text class="lbl" x="898" y="544" text-anchor="middle">Trajectory solving</text>
  <text class="note" x="898" y="568" text-anchor="middle">when two or more stations caught the</text>
  <text class="note" x="898" y="588" text-anchor="middle">same meteor, its real 3D path, speed</text>
  <text class="note" x="898" y="612" text-anchor="middle">and orbit fall out of the geometry</text>
  <text class="note" x="898" y="632" text-anchor="middle">one camera alone cannot do this</text>

  <rect class="rov" x="1136" y="512" width="264" height="126" rx="7"/>
  <text class="lbl" x="1268" y="544" text-anchor="middle">ROVIMEN dashboard</text>
  <text class="note" x="1268" y="568" text-anchor="middle">your clips and stacks,</text>
  <text class="note" x="1268" y="588" text-anchor="middle">within minutes</text>
  <text class="note" x="1268" y="612" text-anchor="middle">station health you can</text>
  <text class="note" x="1268" y="632" text-anchor="middle">check at any time</text>

  <text class="tiny" x="52" y="686">The detect-and-stack burst is the only heavy load: recording all night barely uses the machine, so buy the CPU for dawn, not for dusk.</text>
  <text class="tiny" x="52" y="708">Nothing here needs a person. The only reason to log in is to check that it is still running, and the dashboard shows that at a glance.</text>

</svg>
