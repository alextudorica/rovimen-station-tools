# Template for watchdog_config.yaml (the live file is gitignored and excluded
# from deploys, so it survives every release). On the VPS:
#
#   cp /opt/rovimen/watchdog_config.example.yaml /opt/rovimen/watchdog_config.yaml
#   chown rovimen:rovimen /opt/rovimen/watchdog_config.yaml
#   chmod 600 /opt/rovimen/watchdog_config.yaml
#
# Every key below is optional — an empty file runs on these defaults.

# ── Alert transports ────────────────────────────────────────────────────────
# Discord and Telegram are independent: configure either, both, or neither.
# With neither, alerts are only written to the journal.
#
# Secrets may live here (mode 0600) or in the service environment
# (EnvironmentFile=/etc/rovimen-dashboard.env); a value set here wins.
#   ROVIMEN_WATCHDOG_WEBHOOK            -> discord_webhook_url
#   ROVIMEN_TELEGRAM_BOT_TOKEN          -> telegram_bot_token
#   ROVIMEN_WATCHDOG_TELEGRAM_CHAT_ID   -> telegram_chat_id
#
# telegram_chat_id is the OPERATOR chat. It is deliberately a separate
# variable from ROVIMEN_TELEGRAM_RO_CHAT_ID (the public "Meteori România"
# channel the nightly summary posts to) — fleet alerts must never land there.
discord_webhook_url: ""
telegram_bot_token: ""
telegram_chat_id: ""

# ── Polling ─────────────────────────────────────────────────────────────────
poll_interval_s: 300

# No alert of any kind is sent during the first N cycles after the process
# starts. Stations are still polled and every suppressed alert is logged, so
# a restart is quiet and the first run never pages for the whole fleet's
# standing problems. At poll_interval_s 300 this is a 15-minute window.
startup_grace_polls: 3

# Host keys that are polled and logged but never alert. Use for stations that
# are known dead or under maintenance, so their permanent failure does not
# bury the fleet's real problems. Remove an entry to page for it again.
mute_stations: []
#  - gmnro10
#  - gmnro11

# ── Thresholds ──────────────────────────────────────────────────────────────
thresholds:
  disk_warn_pct: 85
  disk_critical_pct: 95
  janitor_stale_hours: 26
  dawn_deadline_utc: "12:00"
  # Alert when a station's bundle build lags the VPS channel AND its last
  # successful verify is older than this many days (freeze-attack detection).
  bundle_stale_days: 3

# Signed-bundle verify-mode expectation. Leave empty during the warn rollout;
# set to "enforce" after the fleet cutover so any station left in warn (or
# without a mode file) raises a warning.
expected_verify_mode: ""

# ── Cooldowns and grace ─────────────────────────────────────────────────────
cooldowns:
  # How long a standing problem waits before it is repeated.
  repeat_alert_minutes: 120
  # Consecutive healthy polls before a resolved message is sent.
  resolve_delay_polls: 2
  # Consecutive failing polls before a problem pages. Both defaults are 3
  # (~15 min): a unit caught mid-restart and a disk a janitor pass is about
  # to drain are the two most common single-poll false alarms.
  services_grace_polls: 3
  disk_grace_polls: 3

# ── Dawn completeness window ────────────────────────────────────────────────
dawn_check_window_utc:
  start: "08:00"
  end: "14:00"
