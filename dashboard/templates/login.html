<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#161b22">
<title>ROVIMEN — Login</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg', v=build_version) }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png', v=build_version) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css', v=build_version) }}">
<style>
/* :root tokens (--bg, --card, --border, --text, --muted, --green, --red,
   --blue) come from dashboard.css. Login-specific styling stays here so
   the auth shell remains visually distinct from the dashboard header.
   The page is one centred column: the login box, then the licence footer. */
body{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:24px;min-height:100vh;padding:16px;font-family:var(--ui-font)}
.login-box{background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:32px 36px;width:360px;max-width:100%}
.login-logo{text-align:center;margin-bottom:8px}
.login-logo img{max-width:100%;height:auto}
.login-subtitle{font-size:11px;font-weight:600;color:var(--muted);text-align:center;margin-bottom:24px;
  text-transform:uppercase;letter-spacing:1px}
.login-field{margin-bottom:16px}
.login-field label{display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px;
  color:var(--muted);margin-bottom:6px}
.login-field input{width:100%;background:var(--bg);border:1px solid var(--border);
  color:var(--text);font-family:var(--ui-font);font-size:13px;padding:10px 12px;border-radius:6px;
  box-sizing:border-box;transition:border-color .15s,box-shadow .15s}
.login-field input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(88,166,255,.35)}
.login-field input[aria-invalid="true"]{border-color:var(--red)}
.login-btn{width:100%;background:rgba(88,166,255,.12);border:1px solid rgba(88,166,255,.35);
  color:var(--blue);font-family:var(--ui-font);font-size:13px;font-weight:600;padding:10px;
  border-radius:6px;cursor:pointer;margin-top:8px;touch-action:manipulation;
  transition:background-color .15s}
.login-btn:hover{background:rgba(88,166,255,.22)}
.login-btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.login-btn:disabled{opacity:.6;cursor:progress}
.login-error{background:rgba(248,81,73,.08);border:1px solid rgba(248,81,73,.25);
  border-radius:6px;padding:10px;color:var(--red);font-size:12px;text-align:center;
  margin-bottom:16px}
.login-error:empty{display:none}
/* Phone — at 375 px the 36 px horizontal padding eats most of the box.
   Tighten it and bump input font to 16 px so iOS Safari doesn't auto-zoom
   the page when either field gets focus. Buttons + inputs reach the
   44 px Apple HIG tap-target floor. */
@media(max-width:540px){
  .login-box{padding:24px 16px}
  .login-field input{font-size:16px;padding:12px;min-height:44px}
  .login-btn{font-size:14px;padding:14px;min-height:44px}
}
@media(prefers-reduced-motion:reduce){
  .login-field input,.login-btn{transition:none}
}
</style>
<script type="module" src="{{ url_for('static', filename='dashboard-common.js', v=build_version) }}"></script>
</head>
<body>
<div class="auth-time" title="Current UTC time and tonight's RMS capture window at the centre of Romania">
  <span id="utc-clock" class="hdr-clock" translate="no">&mdash;</span>
  <span class="nav-rms js-rms-window" translate="no" hidden></span>
</div>
<form class="login-box" method="POST" action="/login" id="login-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="login-logo"><img src="{{ url_for('static', filename='img/rovimen_logo.svg', v=build_version) }}" alt="ROVIMEN, Romanian Video Meteor Network" width="260" height="121" decoding="async" fetchpriority="high"></div>
  <h1 class="login-subtitle">Admin Login</h1>
  <div class="login-error" id="login-error" role="alert" aria-live="assertive">{% if error %}{{ error }}{% endif %}</div>
  <div class="login-field">
    <label for="login-username">Username</label>
    <input id="login-username" type="text" name="username" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false" autofocus required
           {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
  </div>
  <div class="login-field">
    <label for="login-password">Password</label>
    <input id="login-password" type="password" name="password" autocomplete="current-password" required
           {% if error %}aria-invalid="true" aria-describedby="login-error"{% endif %}>
  </div>
  <button type="submit" class="login-btn" data-busy-label="Signing in…">Sign In</button>
</form>
{# Auth pages load no app panel, so the footer leaves out its About button. #}
{% set no_app_panel = true %}{% include "_license_footer.html" %}
<script>
/* Disable the submit button only once the request starts; re-enable it when
   the page comes back from the back/forward cache. */
(function () {
  var form = document.getElementById('login-form');
  var btn = form.querySelector('button[type="submit"]');
  var idle = btn.textContent;
  form.addEventListener('submit', function () {
    btn.disabled = true;
    btn.textContent = btn.dataset.busyLabel;
  });
  window.addEventListener('pageshow', function () {
    btn.disabled = false;
    btn.textContent = idle;
  });
})();
</script>
</body>
</html>
