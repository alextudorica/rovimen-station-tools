<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#161b22">
<title>ROVIMEN — Social Media Report</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg', v=build_version) }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png', v=build_version) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css', v=build_version) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard-overview.css', v=build_version) }}">
<script type="importmap">
{
  "imports": {
    "/static/dashboard-basket-add.js": "{{ url_for('static', filename='dashboard-basket-add.js', v=build_version) }}",
    "/static/dashboard-grid.js": "{{ url_for('static', filename='dashboard-grid.js', v=build_version) }}",
    "/static/dashboard-hidden.js": "{{ url_for('static', filename='dashboard-hidden.js', v=build_version) }}",
    "/static/dashboard-map-point.js": "{{ url_for('static', filename='dashboard-map-point.js', v=build_version) }}",
    "/static/dashboard-marker-layout.js": "{{ url_for('static', filename='dashboard-marker-layout.js', v=build_version) }}",
    "/static/dashboard-hof-add.js": "{{ url_for('static', filename='dashboard-hof-add.js', v=build_version) }}",
    "/static/dashboard-sky.js": "{{ url_for('static', filename='dashboard-sky.js', v=build_version) }}",
    "/static/dashboard-hof.js": "{{ url_for('static', filename='dashboard-hof.js', v=build_version) }}",
    "/static/dashboard-mask-editor.js": "{{ url_for('static', filename='dashboard-mask-editor.js', v=build_version) }}",
    "/static/dashboard-multi-det-modal.js": "{{ url_for('static', filename='dashboard-multi-det-modal.js', v=build_version) }}",
    "/static/dashboard-nav-carts.js": "{{ url_for('static', filename='dashboard-nav-carts.js', v=build_version) }}",
    "/static/dashboard-time-picker.js": "{{ url_for('static', filename='dashboard-time-picker.js', v=build_version) }}",
    "/static/dashboard-video-modal.js": "{{ url_for('static', filename='dashboard-video-modal.js', v=build_version) }}",
    "/static/dashboard-common.js": "{{ url_for('static', filename='dashboard-common.js', v=build_version) }}"
  }
}

<script type="module" src="{{ url_for('static', filename='dashboard-common.js', v=build_version) }}"></script>
<style>
.soc-wrap {
  max-width: 860px;
  margin: 0 auto;
  padding: 2rem 1.5rem 4rem;
}
.soc-heading {
  font-family: var(--ui-font);
  font-size: 1rem;
  font-weight: 600;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 1.6rem;
}
.soc-week-nav {
  display: flex;
  align-items: center;
  gap: .65rem;
  margin-bottom: 1.4rem;
  flex-wrap: wrap;
}
.soc-week-nav button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: .35rem .85rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: .82rem;
  font-family: var(--ui-font);
  touch-action: manipulation;
  transition: border-color .15s, color .15s;
}
.soc-week-nav button:hover { border-color: var(--blue); color: var(--blue); }
.soc-week-nav button:disabled { opacity: .45; cursor: default; border-color: var(--border); color: var(--muted); }
.soc-week-label {
  font-family: var(--mono-font, monospace);
  font-variant-numeric: tabular-nums;
  font-size: .88rem;
  color: var(--muted);
  min-width: 180px;
  text-align: center;
}
.soc-generate {
  background: var(--blue);
  color: #000;
  border: none;
  padding: .38rem 1.1rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: .83rem;
  font-weight: 600;
  font-family: var(--ui-font);
  margin-left: auto;
  transition: opacity .15s;
}
.soc-generate:hover:not(:disabled) { opacity: .85; }
.soc-generate:disabled { opacity: .5; cursor: progress; }
.soc-body {
  display: grid;
  grid-template-columns: 1fr 240px;
  gap: 1.5rem;
  align-items: start;
}
@media (max-width: 660px) {
  .soc-body { grid-template-columns: 1fr; }
  .soc-generate { margin-left: 0; }
}
.soc-textarea {
  width: 100%;
  box-sizing: border-box;
  min-height: 440px;
  resize: vertical;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: var(--mono-font, monospace);
  font-size: .82rem;
  line-height: 1.7;
  padding: 1rem;
  transition: border-color .15s, box-shadow .15s;
}
.soc-textarea:focus { outline: none; border-color: var(--blue); box-shadow: 0 0 0 2px rgba(88,166,255,.35); }
.soc-actions {
  display: flex;
  gap: .55rem;
  margin-top: .75rem;
  flex-wrap: wrap;
}
.soc-btn {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: .36rem .9rem;
  border-radius: 6px;
  cursor: pointer;
  font-size: .82rem;
  font-family: var(--ui-font);
  touch-action: manipulation;
  transition: border-color .15s, color .15s;
}
.soc-btn:hover { border-color: var(--blue); color: var(--blue); }
.soc-btn-primary { border-color: var(--blue); color: var(--blue); }
.soc-status {
  font-size: .78rem;
  color: var(--muted);
  margin-top: .55rem;
  min-height: 1.2em;
}
.soc-status.error { color: var(--red); }
.soc-week-nav button:focus-visible, .soc-btn:focus-visible {
  outline: 2px solid var(--blue); outline-offset: 2px;
}
.soc-generate:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.soc-image-wrap {
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: hidden;
  background: var(--card);
  aspect-ratio: 4/3;
  display: flex;
  align-items: center;
  justify-content: center;
}
.soc-image-wrap img {
  width: 100%;
  height: 100%;
  object-fit: contain;
}
.soc-image-placeholder {
  font-size: .78rem;
  color: var(--muted);
  text-align: center;
  padding: 1rem;
  line-height: 1.5;
}
.soc-metrics {
  margin-top: 1rem;
  display: flex;
  flex-direction: column;
}
.soc-metric {
  display: flex;
  justify-content: space-between;
  font-size: .78rem;
  padding: .38rem 0;
  border-bottom: 1px solid var(--border);
}
.soc-metric:last-child { border-bottom: none; }
.soc-metric-label { color: var(--muted); }
.soc-metric-value { color: var(--text); font-family: var(--mono-font, monospace); font-variant-numeric: tabular-nums; }
@media (prefers-reduced-motion: reduce) {
  .soc-week-nav button, .soc-generate, .soc-textarea, .soc-btn { transition: none; }
}
</style>
</head>
<body>

<div class="ov-header">
  {% set nav_active = 'social' %}{% include "_nav.html" %}
</div>

<main class="soc-wrap">
  <h1 class="soc-heading">Social Media Report</h1>

  <div class="soc-week-nav">
    <button type="button" id="soc-prev"><span aria-hidden="true">&#8592;</span> Previous week</button>
    <span class="soc-week-label" id="soc-week-label" aria-live="polite">—</span>
    <button type="button" id="soc-next" disabled>Next week <span aria-hidden="true">&#8594;</span></button>
    <button type="button" class="soc-generate" id="soc-generate">Generate</button>
  </div>

  <div class="soc-body">
    <div>
      <textarea class="soc-textarea" id="soc-text" spellcheck="false" autocomplete="off"
        aria-label="Weekly report text"
        placeholder="Press Generate to pre-fill the weekly report…"></textarea>
      <div class="soc-actions">
        <button type="button" class="soc-btn soc-btn-primary" id="soc-copy">Copy text</button>
        <button type="button" class="soc-btn" id="soc-download-zip">Download ZIP</button>
      </div>
      <p class="soc-status" id="soc-status" role="status" aria-live="polite"></p>
    </div>

    <div class="soc-sidebar">
      <div class="soc-image-wrap" id="soc-image-wrap">
        <p class="soc-image-placeholder" id="soc-image-placeholder">The highlight image will appear after generating.</p>
        <img id="soc-image" style="display:none" alt="Highlight meteor stack" decoding="async">
      </div>

      <div class="soc-metrics" id="soc-metrics" style="display:none">
        <div class="soc-metric">
          <span class="soc-metric-label">Total detections</span>
          <span class="soc-metric-value" id="m-detections">—</span>
        </div>
        <div class="soc-metric">
          <span class="soc-metric-label">Multi-station events</span>
          <span class="soc-metric-value" id="m-multistation">—</span>
        </div>
        <div class="soc-metric">
          <span class="soc-metric-label">Clear nights</span>
          <span class="soc-metric-value" id="m-nights">—</span>
        </div>
        <div class="soc-metric">
          <span class="soc-metric-label">Orbits computed</span>
          <span class="soc-metric-value" id="m-orbits">—</span>
        </div>
        <div class="soc-metric">
          <span class="soc-metric-label">Stations / cameras</span>
          <span class="soc-metric-value" id="m-stations">—</span>
        </div>
      </div>
    </div>
  </div>
</main>

<div id="app-panel" class="app-panel" role="dialog" aria-modal="true" aria-hidden="true" onclick="appPanelClose(event)">
  <div class="app-panel-inner">
    <div class="app-panel-header">
      <span id="app-panel-title" class="app-panel-title"></span>
      <button class="cam-modal-close" aria-label="Close panel" onclick="appPanelClose(null)">&#x2715;</button>
    </div>
    <div id="app-panel-body"></div>
  </div>
</div>

<script>
(function () {
  const DAY_MONTH = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short' });

  // weekOffset: 0 = last full Mon–Sun, -1 = the one before, etc.
  let weekOffset = 0;

  function weekBounds(offset) {
    const now = new Date();
    const dow = now.getDay() === 0 ? 7 : now.getDay();
    const thisMon = new Date(now);
    thisMon.setDate(now.getDate() - (dow - 1));
    thisMon.setHours(0, 0, 0, 0);
    const mon = new Date(thisMon);
    mon.setDate(thisMon.getDate() + (offset - 1) * 7);
    const sun = new Date(mon);
    sun.setDate(mon.getDate() + 6);
    return { start: mon, end: sun };
  }

  // Local calendar date: toISOString() would shift local midnight to the
  // previous UTC day east of Greenwich and send Sunday-Saturday.
  function toISO(d) {
    return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
  }

  function fmtDate(d) { return DAY_MONTH.format(d); }
  function fmtBounds(b) { return `${fmtDate(b.start)} – ${fmtDate(b.end)} ${b.end.getFullYear()}`; }

  function updateLabel() {
    document.getElementById('soc-week-label').textContent = fmtBounds(weekBounds(weekOffset));
    document.getElementById('soc-next').disabled = weekOffset >= 0;
  }

  document.getElementById('soc-prev').addEventListener('click', () => { weekOffset--; updateLabel(); });
  document.getElementById('soc-next').addEventListener('click', () => { if (weekOffset < 0) { weekOffset++; updateLabel(); } });

  updateLabel();

  const btnGenerate  = document.getElementById('soc-generate');
  const txtArea      = document.getElementById('soc-text');
  const statusEl     = document.getElementById('soc-status');
  const metricsEl    = document.getElementById('soc-metrics');
  const imageEl      = document.getElementById('soc-image');
  const placeholderEl = document.getElementById('soc-image-placeholder');

  let lastBounds = null;

  function setStatus(msg, isError) {
    statusEl.textContent = msg;
    statusEl.className = 'soc-status' + (isError ? ' error' : '');
  }

  async function generate() {
    const bounds = weekBounds(weekOffset);
    lastBounds = bounds;
    const params = new URLSearchParams({ start: toISO(bounds.start), end: toISO(bounds.end) });

    btnGenerate.disabled = true;
    btnGenerate.textContent = 'Generating…';
    setStatus('Computing from the archive. This can take 20–30 seconds…', false);

    try {
      const resp = await fetch('/api/social/weekly?' + params);
      if (!resp.ok) throw new Error(`Server error ${resp.status}`);
      const data = await resp.json();

      txtArea.value = data.text;

      const m = data.metrics;
      document.getElementById('m-detections').textContent   = m.total_detections.toLocaleString('en-US');
      document.getElementById('m-multistation').textContent = m.multistation.toLocaleString('en-US');
      document.getElementById('m-nights').textContent       = `${m.clear_nights} / ${m.total_nights}`;
      document.getElementById('m-orbits').textContent       = m.total_orbits.toLocaleString('en-US');
      document.getElementById('m-stations').textContent     = `${m.active_stations} stations · ${m.active_cameras} cameras`;
      metricsEl.style.display = '';

      if (data.stack_url) {
        imageEl.src = data.stack_url;
        imageEl.style.display = '';
        placeholderEl.style.display = 'none';
      } else {
        imageEl.style.display = 'none';
        placeholderEl.style.display = '';
        placeholderEl.textContent = 'No image found for this week.';
      }

      setStatus('Generated. You can edit the text before posting.', false);
    } catch (e) {
      setStatus('Error: ' + e.message, true);
    } finally {
      btnGenerate.disabled = false;
      btnGenerate.textContent = 'Generate';
    }
  }

  btnGenerate.addEventListener('click', generate);

  document.getElementById('soc-copy').addEventListener('click', async () => {
    if (!txtArea.value) { setStatus('Generate the report first.', true); return; }
    try {
      await navigator.clipboard.writeText(txtArea.value);
      setStatus('Copied to clipboard.', false);
    } catch {
      txtArea.select();
      document.execCommand('copy');
      setStatus('Copied.', false);
    }
  });

  document.getElementById('soc-download-zip').addEventListener('click', () => {
    if (!lastBounds) { setStatus('Generate the report first.', true); return; }
    const params = new URLSearchParams({ start: toISO(lastBounds.start), end: toISO(lastBounds.end) });
    window.location.href = '/api/social/weekly/zip?' + params;
  });
})();
</script>
  {% include "_license_footer.html" %}
</body>
</html>
