<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#161b22">
<title>ROVIMEN — Config</title>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg', v=build_version) }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png', v=build_version) }}">
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css', v=build_version) }}">
<script type="importmap">
{
  "imports": {
    "/static/dashboard-basket-add.js": "{{ url_for('static', filename='dashboard-basket-add.js', v=build_version) }}",
    "/static/dashboard-grid.js": "{{ url_for('static', filename='dashboard-grid.js', v=build_version) }}",
    "/static/dashboard-hidden.js": "{{ url_for('static', filename='dashboard-hidden.js', v=build_version) }}",
    "/static/dashboard-map-point.js": "{{ url_for('static', filename='dashboard-map-point.js', v=build_version) }}",
    "/static/dashboard-marker-layout.js": "{{ url_for('static', filename='dashboard-marker-layout.js', v=build_version) }}",
    "/static/dashboard-hof-add.js": "{{ url_for('static', filename='dashboard-hof-add.js', v=build_version) }}",
    "/static/dashboard-sky.js": "{{ url_for('static', filename='dashboard-sky.js', v=build_version) }}",
    "/static/dashboard-hof.js": "{{ url_for('static', filename='dashboard-hof.js', v=build_version) }}",
    "/static/dashboard-mask-editor.js": "{{ url_for('static', filename='dashboard-mask-editor.js', v=build_version) }}",
    "/static/dashboard-nav-carts.js": "{{ url_for('static', filename='dashboard-nav-carts.js', v=build_version) }}",
    "/static/dashboard-time-picker.js": "{{ url_for('static', filename='dashboard-time-picker.js', v=build_version) }}",
    "/static/dashboard-common.js":          "{{ url_for('static', filename='dashboard-common.js',          v=build_version) }}",
    "/static/dashboard-video-modal.js":     "{{ url_for('static', filename='dashboard-video-modal.js',     v=build_version) }}",
    "/static/dashboard-multi-det-modal.js": "{{ url_for('static', filename='dashboard-multi-det-modal.js', v=build_version) }}"
  }
}
</script>
<script type="module" src="{{ url_for('static', filename='dashboard-common.js', v=build_version) }}"></script>
<link rel="stylesheet" href="{{ url_for('static', filename='dashboard-config.css', v=build_version) }}">
</head>
<body>

<div class="cfg-header" id="cfg-header">
  {% set nav_active = 'admin' %}{% include "_nav.html" %}
</div>

<main class="cfg-main">
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap">Station configs</h1>
  <div id="cfg-status-bar" class="cfg-status"></div>
  <div id="cfg-diff-banner" class="cfg-diff-banner"></div>
  <div id="cfg-body"><div class="cfg-loading">Loading station configs…</div></div>
</main>

<script type="module" src="{{ url_for('static', filename='dashboard-config.js', v=build_version) }}"></script>


<!-- SW registration (kept inline) -->
<script>
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('/sw.js').catch(err => {
    console.warn('SW registration failed', err);
  });
}
</script>
<div id="app-panel" class="app-panel" role="dialog" aria-modal="true" aria-hidden="true" onclick="appPanelClose(event)">
  <div class="app-panel-inner">
    <div class="app-panel-header">
      <span id="app-panel-title" class="app-panel-title"></span>
      <button class="cam-modal-close" aria-label="Close panel" onclick="appPanelClose(null)">&#x2715;</button>
    </div>
    <div id="app-panel-body"></div>
  </div>
</div>
  {% include "_license_footer.html" %}
</body>
</html>
